<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 722" width="960" height="722" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Fast, safe, and no master key</title>
  <desc id="desc">Fast, measured on the Godot repository (867 MiB of history) with a Git backend, median of three runs, comparing plain Git, git-remote-gcrypt, and git-remote-e2ee. Data sent per one-line push: 4.5 KB, 921 MB, 8.9 KB. Small change: push 0.08 s, 6.5 s, 0.97 s; fetch 0.07 s, 22.6 s, 0.77 s. Whole history: initial push 28.4 s, 36.6 s, 22.9 s; fresh fetch 27.7 s, 55.0 s, 40.0 s. Peak memory: small push 37 MiB, 887 MiB, 9 MiB; initial push 1.27 GiB, 0.98 GiB, 1.27 GiB. Safe: when two devices push at once, storage accepts one through compare-and-swap and rejects the other, while gcrypt would let the second push erase the first. No master key: every push gets a fresh key wrapped for each device; a revoked device gets no key for later pushes, while git-crypt shares one key with everyone. Icons from Tabler Icons (MIT).</desc>
