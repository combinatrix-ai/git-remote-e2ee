<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Fast, safe, and no master key</title>
  <desc id="desc">Fast: a one-line push sends 4.5 KB with plain Git, 921 MB with git-remote-gcrypt on a Git backend, and 8.9 KB with git-remote-e2ee (log scale). Safe: when two devices push at once, storage accepts one through compare-and-swap and rejects the other, while gcrypt would let the second push erase the first. No master key: every push gets a fresh key wrapped for each device; a revoked device gets no key for later pushes, while git-crypt shares one key with everyone. Icons from Tabler Icons (MIT).</desc>
  <defs>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /> <path d="M15 9h.01" /></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l18 0" /> <path d="M5 7a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -8" /></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" /> <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" /> <path d="M8 11v-4a4 4 0 1 1 8 0v4" /></symbol>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6b3a"/></marker>
    <marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a4371b"/></marker>
  </defs>
  <rect width="960" height="372" rx="16" fill="#faf8f4"/>

  <!-- Fast -->
  <rect x="16" y="16" width="300" height="340" rx="12" fill="#fffdf9" stroke="#e4ded3"/>
  <text x="36" y="50" font-size="20" font-weight="700" fill="#1c1a17">Fast</text>
  <text x="36" y="72" font-size="13" fill="#6b645a">Pushes upload only what changed</text>
  <text x="36" y="106" font-size="12" font-weight="600" fill="#3d3830">Data sent per one-line push</text>
  <text x="36" y="137" font-size="12" fill="#3d3830">Plain Git</text>
  <rect x="100" y="122" width="21" height="22" rx="3" fill="#8a8276"/>
  <text x="127" y="137" font-size="12" fill="#3d3830">4.5 KB</text>
  <text x="36" y="173" font-size="12" fill="#3d3830">gcrypt</text>
  <rect x="100" y="158" width="196" height="22" rx="3" fill="#a4371b"/>
  <text x="290" y="173" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">921 MB</text>
  <text x="36" y="209" font-size="12" font-weight="600" fill="#1c1a17">e2ee</text>
  <rect x="100" y="194" width="30" height="22" rx="3" fill="#2f6b3a"/>
  <text x="136" y="209" font-size="12" font-weight="600" fill="#2f6b3a">8.9 KB</text>
  <text x="296" y="234" font-size="10" fill="#8a8276" text-anchor="end">log scale</text>
  <text x="36" y="262" font-size="12" fill="#3d3830">Push time <tspan font-weight="600" fill="#2f6b3a">0.97 s</tspan> <tspan fill="#8a8276">(gcrypt 6.5 s)</tspan></text>
  <text x="36" y="282" font-size="12" fill="#3d3830">Fetch time <tspan font-weight="600" fill="#2f6b3a">0.77 s</tspan> <tspan fill="#8a8276">(gcrypt 22.6 s)</tspan></text>
  <line x1="36" y1="300" x2="296" y2="300" stroke="#e4ded3"/>
  <text x="36" y="322" font-size="11" fill="#8a8276">Godot, 867 MiB of history, Git backend.</text>

  <!-- Safe -->
  <rect x="330" y="16" width="300" height="340" rx="12" fill="#fffdf9" stroke="#e4ded3"/>
  <text x="350" y="50" font-size="20" font-weight="700" fill="#1c1a17">Safe</text>
  <text x="350" y="72" font-size="13" fill="#6b645a">No silent force pushes</text>
  <text x="390" y="104" font-size="12" font-weight="600" fill="#3d3830" text-anchor="middle">Device A</text>
  <use href="#i-laptop" x="368" y="106" width="44" height="44" stroke="#6b645a"/>
  <text x="570" y="104" font-size="12" font-weight="600" fill="#3d3830" text-anchor="middle">Device B</text>
  <use href="#i-laptop" x="548" y="106" width="44" height="44" stroke="#6b645a"/>
  <line x1="394" y1="152" x2="452" y2="190" stroke="#2f6b3a" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="566" y1="152" x2="508" y2="190" stroke="#a4371b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-no)"/>
  <circle cx="414" cy="166" r="10" fill="#2f6b3a"/>
  <path d="M409 166l3.5 3.5l6 -7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="546" cy="166" r="10" fill="#a4371b"/>
  <path d="M542 162l8 8M550 162l-8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <rect x="425" y="194" width="110" height="40" rx="8" fill="#eef1f5" stroke="#5f6c80"/>
  <use href="#i-lock" x="436" y="203" width="22" height="22" stroke="#5f6c80"/>
  <text x="464" y="219" font-size="13" font-weight="600" fill="#1c1a17">HEAD</text>
  <text x="480" y="252" font-size="11" fill="#6b645a" text-anchor="middle">compare-and-swap</text>
  <text x="480" y="274" font-size="12" fill="#3d3830" text-anchor="middle">One push wins; the other gets an</text>
  <text x="480" y="290" font-size="12" fill="#3d3830" text-anchor="middle">ordinary rejection and pulls first.</text>
  <line x1="350" y1="300" x2="610" y2="300" stroke="#e4ded3"/>
  <text x="350" y="322" font-size="11" fill="#8a8276">gcrypt: every push is a force push,</text>
  <text x="350" y="337" font-size="11" fill="#8a8276">so B can erase A's work.</text>

  <!-- No master key -->
  <rect x="644" y="16" width="300" height="340" rx="12" fill="#fffdf9" stroke="#e4ded3"/>
  <text x="664" y="50" font-size="20" font-weight="700" fill="#1c1a17">No master key</text>
  <text x="664" y="72" font-size="13" fill="#6b645a">A fresh key per push, per device</text>
  <text x="764" y="106" font-size="11" fill="#8a8276" text-anchor="middle">push 1</text>
  <text x="824" y="106" font-size="11" fill="#8a8276" text-anchor="middle">push 2</text>
  <text x="900" y="106" font-size="11" fill="#8a8276" text-anchor="middle">push 3</text>
  <text x="664" y="141" font-size="12" fill="#3d3830">Laptop</text>
  <text x="664" y="181" font-size="12" fill="#3d3830">CI (read)</text>
  <text x="664" y="221" font-size="12" fill="#3d3830">Old phone</text>
  <use href="#i-key" x="753" y="125" width="22" height="22" stroke="#5f6c80"/>
  <use href="#i-key" x="813" y="125" width="22" height="22" stroke="#b3542e"/>
  <use href="#i-key" x="889" y="125" width="22" height="22" stroke="#2f6b3a"/>
  <use href="#i-key" x="753" y="165" width="22" height="22" stroke="#5f6c80"/>
  <use href="#i-key" x="813" y="165" width="22" height="22" stroke="#b3542e"/>
  <use href="#i-key" x="889" y="165" width="22" height="22" stroke="#2f6b3a"/>
  <use href="#i-key" x="753" y="205" width="22" height="22" stroke="#5f6c80"/>
  <use href="#i-key" x="813" y="205" width="22" height="22" stroke="#b3542e"/>
  <circle cx="900" cy="216" r="10" fill="none" stroke="#c9c1b4" stroke-dasharray="3 3"/>
  <line x1="895" y1="216" x2="905" y2="216" stroke="#c9c1b4" stroke-width="2" stroke-linecap="round"/>
  <line x1="862" y1="114" x2="862" y2="236" stroke="#a4371b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="862" y="252" font-size="11" font-weight="600" fill="#a4371b" text-anchor="middle">revoke Old phone</text>
  <text x="664" y="282" font-size="12" fill="#3d3830">Revoke one device, no history rewrite.</text>
  <line x1="664" y1="300" x2="924" y2="300" stroke="#e4ded3"/>
  <text x="664" y="322" font-size="11" fill="#8a8276">git-crypt: one repository key that</text>
  <text x="664" y="337" font-size="11" fill="#8a8276">everyone shares, and no revocation.</text>
</svg>
