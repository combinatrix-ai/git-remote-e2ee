<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">A hacker breaks into the Git host</title>
  <desc id="desc">Left, a private repository: your files sit on GitHub or GitLab in readable form, so a hacker who breaks in reads everything. Right, git-remote-e2ee: the host stores only locked boxes and the key stays on your laptop, so a hacker who breaks in finds nothing readable. Icons from Tabler Icons (MIT) and Griddy Icons (MIT).</desc>
  <defs>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" /> <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" /> <path d="M8 11v-4a4 4 0 1 1 8 0v4" /></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /> <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /> <path d="M9 9l1 0" /> <path d="M9 13l6 0" /> <path d="M9 17l6 0" /></symbol>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /> <path d="M15 9h.01" /></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l18 0" /> <path d="M5 7a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -8" /></symbol>
  
    <symbol id="i-hacker" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="m18.88 9.32l-3.994-5.805A3.5 3.5 0 0 0 12 1.995a3.49 3.49 0 0 0-2.885 1.52L5.12 9.32c-1 1.455-.995 3.4.02 4.845l1.98 2.83h9.76l1.98-2.83a4.26 4.26 0 0 0 .02-4.845M12 15.5a4.97 4.97 0 0 1-4.594-3.035l3.53-.73a5.3 5.3 0 0 1 2.13 0l3.53.73A4.97 4.97 0 0 1 12 15.5m-8.09-.47l1.51 2.16A.99.99 0 0 0 5 18v4H1.385l.43-5.18a2.78 2.78 0 0 1 1.545-2.25l.21-.1c.105.195.215.38.34.56m16.67-.45c.85.425 1.43 1.28 1.51 2.23v.005l.435 5.19H19v-4a.99.99 0 0 0-.42-.81l1.51-2.16c.12-.175.225-.355.325-.535zM12 20a2 2 0 0 0-2 2h4a2 2 0 0 0-2-2" clip-rule="evenodd"/></symbol>
  </defs>
  <rect width="760" height="330" rx="16" fill="#faf8f4"/>
  <text x="28" y="40" font-size="16" font-weight="600" fill="#1c1a17">Private repository</text>
  <use href="#i-laptop" x="20" y="106" width="72" height="72" stroke="#6b645a"/>
  
  <line x1="96" y1="142" x2="118" y2="142" stroke="#8a8276" stroke-width="2"/><polygon points="118,136 128,142 118,148" fill="#8a8276"/>
  <rect x="132" y="58" width="164" height="180" rx="12" fill="#fdf1ec" stroke="#e8c4b4" stroke-width="1.5"/>
  <rect x="292" y="158" width="8" height="46" fill="#faf8f4"/>
  <path d="M296 158 l-5 6 l6 5 l-6 6 M296 204 l-5 -6 l6 -5 l-6 -6" fill="none" stroke="#e8c4b4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="146" y="82" font-size="13" font-weight="600" fill="#6b645a">GitHub, GitLab, …</text>
  <use href="#i-doc" x="144" y="96" width="44" height="44" stroke="#a4371b"/>
  <use href="#i-doc" x="192" y="96" width="44" height="44" stroke="#a4371b"/>
  <use href="#i-doc" x="240" y="96" width="44" height="44" stroke="#a4371b"/>
  <use href="#i-hacker" x="308" y="150" width="62" height="62" color="#1c1a17"/>
  <path d="M308 182 C 276 182, 262 172, 254 152" fill="none" stroke="#a4371b" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="250,144 248,156 259,152" fill="#a4371b"/>
  
  <text x="28" y="280" font-size="15" font-weight="600" fill="#a4371b">A break-in exposes everything.</text>
  <text x="28" y="302" font-size="12.5" fill="#3d3830">Your files sit on the server in readable form.</text>
  <line x1="380" y1="28" x2="380" y2="310" stroke="#e4ded3"/>
  <text x="408" y="40" font-size="16" font-weight="600" fill="#1c1a17">git-remote-e2ee</text>
  <use href="#i-laptop" x="400" y="106" width="72" height="72" stroke="#6b645a"/>
  <use href="#i-key" x="419" y="76" width="34" height="34" stroke="#2f6b3a"/>
  <line x1="476" y1="142" x2="498" y2="142" stroke="#8a8276" stroke-width="2"/><polygon points="498,136 508,142 498,148" fill="#8a8276"/>
  <rect x="512" y="58" width="164" height="180" rx="12" fill="#eef1f5" stroke="#d5dbe4" stroke-width="1.5"/>
  <rect x="672" y="158" width="8" height="46" fill="#faf8f4"/>
  <path d="M676 158 l-5 6 l6 5 l-6 6 M676 204 l-5 -6 l6 -5 l-6 -6" fill="none" stroke="#d5dbe4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="526" y="82" font-size="13" font-weight="600" fill="#6b645a">GitHub, GitLab, …</text>
  <use href="#i-lock" x="524" y="96" width="44" height="44" stroke="#5f6c80"/>
  <use href="#i-lock" x="572" y="96" width="44" height="44" stroke="#5f6c80"/>
  <use href="#i-lock" x="620" y="96" width="44" height="44" stroke="#5f6c80"/>
  <use href="#i-hacker" x="688" y="150" width="62" height="62" color="#1c1a17"/>
  <path d="M688 182 C 656 182, 642 172, 634 152" fill="none" stroke="#a4371b" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="630,144 628,156 639,152" fill="#a4371b"/>
  <text x="636" y="196" font-size="22" font-weight="700" fill="#a4371b">?</text>
  <text x="408" y="280" font-size="15" font-weight="600" fill="#2f6b3a">A break-in finds only locked boxes.</text>
  <text x="408" y="302" font-size="12.5" fill="#3d3830">The key never leaves your devices.</text>
</svg>
