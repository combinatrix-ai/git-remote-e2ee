<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title desc">
  <title id="title">A private repository versus an end-to-end encrypted repository</title>
  <desc id="desc">With an ordinary private repository the host stores readable files, messages, and branches, so a breach, a leaked token, an insider, or a legal demand exposes them. With git-remote-e2ee the repository is encrypted on your device, the host stores only ciphertext, and the same threats find nothing readable.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .h { font-size: 15px; font-weight: 600; fill: #1c1a17; }
    .label { font-size: 12px; fill: #6b645a; }
    .threat { font-size: 12px; fill: #8a3a1e; }
    .ok { font-size: 13px; font-weight: 600; fill: #2f6b3a; }
    .bad { font-size: 13px; font-weight: 600; fill: #a4371b; }
  </style>
  <rect x="0" y="0" width="760" height="360" rx="16" fill="#faf8f4"/>

  <!-- Row 1: private repository -->
  <text x="24" y="38" class="h">Private repository</text>
  <rect x="24" y="52" width="150" height="104" rx="10" fill="#ffffff" stroke="#e4ded3"/>
  <text x="40" y="78" class="label">Your laptop</text>
  <text x="40" y="102" class="mono" fill="#1c1a17">notes/acme.md</text>
  <text x="40" y="122" class="mono" fill="#1c1a17">"Fix login"</text>
  <text x="40" y="142" class="mono" fill="#1c1a17">main</text>

  <line x1="182" y1="104" x2="262" y2="104" stroke="#8a8276" stroke-width="2"/>
  <polygon points="262,98 274,104 262,110" fill="#8a8276"/>
  <text x="228" y="94" text-anchor="middle" class="label">push</text>

  <rect x="282" y="52" width="190" height="104" rx="10" fill="#fdf1ec" stroke="#e8c4b4"/>
  <text x="298" y="78" class="label">Git host stores</text>
  <text x="298" y="102" class="mono" fill="#1c1a17">notes/acme.md</text>
  <text x="298" y="122" class="mono" fill="#1c1a17">"Fix login"</text>
  <text x="298" y="142" class="mono" fill="#1c1a17">main</text>

  <text x="500" y="72" class="threat">breach</text>
  <text x="500" y="92" class="threat">leaked token or app</text>
  <text x="500" y="112" class="threat">insider</text>
  <text x="500" y="132" class="threat">legal demand</text>
  <line x1="494" y1="102" x2="480" y2="102" stroke="#a4371b" stroke-width="2"/>
  <polygon points="482,96 472,102 482,108" fill="#a4371b"/>
  <text x="652" y="108" class="bad">→ readable</text>

  <line x1="24" y1="182" x2="736" y2="182" stroke="#e4ded3"/>

  <!-- Row 2: git-remote-e2ee -->
  <text x="24" y="218" class="h">git-remote-e2ee</text>
  <rect x="24" y="232" width="150" height="104" rx="10" fill="#ffffff" stroke="#e4ded3"/>
  <text x="40" y="258" class="label">Your laptop + key</text>
  <text x="40" y="282" class="mono" fill="#1c1a17">notes/acme.md</text>
  <text x="40" y="302" class="mono" fill="#1c1a17">"Fix login"</text>
  <text x="40" y="322" class="mono" fill="#1c1a17">main</text>

  <line x1="182" y1="284" x2="262" y2="284" stroke="#b3542e" stroke-width="2.5"/>
  <polygon points="262,277 275,284 262,291" fill="#b3542e"/>
  <text x="228" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="#b3542e">encrypt</text>

  <rect x="282" y="232" width="190" height="104" rx="10" fill="#eef1f5" stroke="#d5dbe4"/>
  <text x="298" y="258" class="label">Git host stores</text>
  <text x="298" y="282" class="mono" fill="#7a8699">3f/9a1c07…</text>
  <text x="298" y="302" class="mono" fill="#7a8699">7c/e04b5d…</text>
  <text x="298" y="322" class="mono" fill="#7a8699">b8/51f2aa…</text>

  <text x="500" y="252" class="threat">breach</text>
  <text x="500" y="272" class="threat">leaked token or app</text>
  <text x="500" y="292" class="threat">insider</text>
  <text x="500" y="312" class="threat">legal demand</text>
  <line x1="494" y1="282" x2="480" y2="282" stroke="#a4371b" stroke-width="2"/>
  <polygon points="482,276 472,282 482,288" fill="#a4371b"/>
  <text x="652" y="288" class="ok">→ ciphertext</text>
</svg>
