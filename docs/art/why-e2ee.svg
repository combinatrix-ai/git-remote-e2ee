<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Threat model: private repository versus git-remote-e2ee</title>
  <desc id="desc">With a private repository you must trust your devices, the Git host's web and API servers, its CI, its staff, and its storage and backups, because the host holds the keys even when data is encrypted in transit and at rest. A breach, an insider, a legal demand, a leaked token, or a stolen backup exposes everything. With git-remote-e2ee only your devices are trusted; the host and its storage hold ciphertext, so the same attacks yield nothing readable and any tampering is rejected by your clients.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 600; fill: #1c1a17; }
    .box { font-size: 13px; font-weight: 600; fill: #1c1a17; }
    .sub { font-size: 11.5px; fill: #6b645a; }
    .chip { font-size: 11px; fill: #3d3830; }
    .trust { font-size: 11.5px; font-weight: 600; fill: #b3542e; }
    .threat { font-size: 11.5px; fill: #a4371b; }
    .bad { font-size: 13px; font-weight: 600; fill: #a4371b; }
    .ok { font-size: 13px; font-weight: 600; fill: #2f6b3a; }
    .arrow { font-size: 11px; fill: #6b645a; }
  </style>
  <rect x="0" y="0" width="760" height="440" rx="16" fill="#faf8f4"/>

  <!-- ===== Row 1: private repository ===== -->
  <text x="24" y="36" class="h">Private repository</text>
  <!-- trust boundary around everything -->
  <rect x="28" y="50" width="704" height="112" rx="12" fill="none" stroke="#b3542e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="724" y="44" text-anchor="end" class="trust">you must trust everything in here</text>

  <rect x="44" y="64" width="140" height="84" rx="10" fill="#ffffff" stroke="#e4ded3"/>
  <text x="58" y="90" class="box">Your devices</text>
  <text x="58" y="110" class="sub">plaintext</text>

  <line x1="190" y1="106" x2="238" y2="106" stroke="#8a8276" stroke-width="2"/>
  <polygon points="238,100 249,106 238,112" fill="#8a8276"/>
  <text x="214" y="98" text-anchor="middle" class="arrow">TLS</text>

  <rect x="256" y="64" width="244" height="84" rx="10" fill="#fdf1ec" stroke="#e8c4b4"/>
  <text x="270" y="90" class="box">Git host</text>
  <text x="340" y="90" class="sub">reads plaintext</text>
  <rect x="270" y="104" width="66" height="28" rx="6" fill="#ffffff" stroke="#e8c4b4"/>
  <text x="303" y="122" text-anchor="middle" class="chip">web &amp; API</text>
  <rect x="345" y="104" width="66" height="28" rx="6" fill="#ffffff" stroke="#e8c4b4"/>
  <text x="378" y="122" text-anchor="middle" class="chip">CI</text>
  <rect x="420" y="104" width="66" height="28" rx="6" fill="#ffffff" stroke="#e8c4b4"/>
  <text x="453" y="122" text-anchor="middle" class="chip">staff</text>

  <line x1="506" y1="106" x2="548" y2="106" stroke="#8a8276" stroke-width="2"/>
  <polygon points="548,100 559,106 548,112" fill="#8a8276"/>

  <rect x="566" y="64" width="152" height="84" rx="10" fill="#fdf1ec" stroke="#e8c4b4"/>
  <text x="580" y="90" class="box">Storage</text>
  <text x="580" y="110" class="sub">disks &amp; backups</text>
  <text x="580" y="128" class="sub">encrypted at rest,</text>
  <text x="580" y="142" class="sub">but the host has the key</text>

  <!-- threats row 1 -->
  <line x1="378" y1="190" x2="378" y2="166" stroke="#a4371b" stroke-width="1.5"/>
  <polygon points="372,168 378,158 384,168" fill="#a4371b"/>
  <text x="378" y="206" text-anchor="middle" class="threat">breach · insider · legal demand · leaked token</text>
  <line x1="642" y1="190" x2="642" y2="166" stroke="#a4371b" stroke-width="1.5"/>
  <polygon points="636,168 642,158 648,168" fill="#a4371b"/>
  <text x="642" y="206" text-anchor="middle" class="threat">stolen backup</text>
  <text x="44" y="206" class="bad">Any one exposes everything.</text>

  <line x1="24" y1="226" x2="736" y2="226" stroke="#e4ded3"/>

  <!-- ===== Row 2: git-remote-e2ee ===== -->
  <text x="24" y="258" class="h">git-remote-e2ee</text>
  <!-- trust boundary around devices only -->
  <rect x="32" y="272" width="164" height="112" rx="12" fill="none" stroke="#b3542e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="266" text-anchor="start" class="trust">trust only your devices</text>

  <rect x="44" y="286" width="140" height="84" rx="10" fill="#ffffff" stroke="#e4ded3"/>
  <text x="58" y="312" class="box">Your devices</text>
  <text x="58" y="332" class="sub">plaintext + keys</text>
  <text x="58" y="350" class="sub">encrypt &amp; verify</text>

  <line x1="202" y1="328" x2="240" y2="328" stroke="#b3542e" stroke-width="2.5"/>
  <polygon points="240,321 252,328 240,335" fill="#b3542e"/>
  <text x="226" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#b3542e">E2EE</text>

  <rect x="256" y="286" width="244" height="84" rx="10" fill="#eef1f5" stroke="#d5dbe4"/>
  <text x="270" y="312" class="box">Git host</text>
  <text x="340" y="312" class="sub">sees ciphertext</text>
  <rect x="270" y="326" width="66" height="28" rx="6" fill="#ffffff" stroke="#d5dbe4"/>
  <text x="303" y="344" text-anchor="middle" class="chip">web &amp; API</text>
  <rect x="345" y="326" width="66" height="28" rx="6" fill="#ffffff" stroke="#d5dbe4"/>
  <text x="378" y="344" text-anchor="middle" class="chip">CI</text>
  <rect x="420" y="326" width="66" height="28" rx="6" fill="#ffffff" stroke="#d5dbe4"/>
  <text x="453" y="344" text-anchor="middle" class="chip">staff</text>

  <line x1="506" y1="328" x2="548" y2="328" stroke="#8a8276" stroke-width="2"/>
  <polygon points="548,322 559,328 548,334" fill="#8a8276"/>

  <rect x="566" y="286" width="152" height="84" rx="10" fill="#eef1f5" stroke="#d5dbe4"/>
  <text x="580" y="312" class="box">Storage</text>
  <text x="580" y="332" class="sub">disks &amp; backups</text>
  <text x="580" y="350" class="sub">ciphertext only</text>

  <!-- threats row 2 -->
  <line x1="378" y1="412" x2="378" y2="388" stroke="#a4371b" stroke-width="1.5"/>
  <polygon points="372,390 378,380 384,390" fill="#a4371b"/>
  <text x="378" y="428" text-anchor="middle" class="threat">breach · insider · legal demand · leaked token</text>
  <line x1="642" y1="412" x2="642" y2="388" stroke="#a4371b" stroke-width="1.5"/>
  <polygon points="636,390 642,380 648,390" fill="#a4371b"/>
  <text x="642" y="428" text-anchor="middle" class="threat">stolen backup</text>
  <text x="44" y="406" class="ok">They get ciphertext.</text>
  <text x="44" y="424" class="ok">Tampering is rejected.</text>
</svg>
